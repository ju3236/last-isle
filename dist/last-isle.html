<title>최후의 섬</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap">
<style>
/* 레이아웃: 어두운 관제 화면 3단 — 왼쪽 생존자·소지품, 가운데 탭(지도·탐험/제작/거점/명단)과 기록, 오른쪽 시계·근처 사람·채팅·섬 소식. 한 가지 어두운 톤으로 고정. */
:root {
  color-scheme: dark;
  --bg: #0a0d12; --panel: #121821; --panel-hi: #161e29; --well: #0b1017; --line: #222c3a; --line2: #33415a;
  --fg: #e6ebf1; --mute: #8592a6; --dim: #5b6779;
  --accent: #3fd0d9; --gold: #f2b54b; --red: #ff5a52; --green: #5fd38a; --blue: #5aa9ff; --purple: #b98bff;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --disp: "Rajdhani", "IBM Plex Sans KR", "Malgun Gothic", sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg) radial-gradient(1200px 600px at 50% -200px, #14202e, transparent); background-attachment: fixed; color: var(--fg); font-family: var(--sans); font-size: 14px; line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line2); background: var(--panel-hi); border-radius: 2px; padding: 6px 12px; transition: border-color .12s, background .12s; }
button:hover:not(:disabled) { border-color: var(--accent); background: #1a2532; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button:disabled { opacity: .35; cursor: default; }
button.go { background: var(--accent); border-color: var(--accent); color: #04191b; font-weight: 600; }
button.go:hover:not(:disabled) { background: #6ee0e7; }
button.danger { border-color: rgba(255,90,82,.6); color: var(--red); }
button.danger:hover:not(:disabled) { background: rgba(255,90,82,.12); border-color: var(--red); }
button.sm { padding: 2px 9px; font-size: 12px; }
input[type=text], input[type=password], select { background: var(--well); border: 1px solid var(--line); border-radius: 2px; padding: 7px 9px; width: 100%; min-width: 0; }
h1, h2, h3 { font-weight: 600; margin: 0; font-size: 14px; }
.lab { font-size: 12px; color: var(--mute); }
.num { font-family: var(--disp); font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: .02em; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.box { background: linear-gradient(180deg, var(--panel-hi), var(--panel) 60px); border: 1px solid var(--line); border-top-color: var(--line2); border-radius: 3px; padding: 14px; display: grid; gap: 10px; min-width: 0; align-content: start; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.box > h3 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.box > h3 > span:first-child { display: flex; align-items: center; gap: 8px; }
.box > h3 > span:first-child::before { content: ""; width: 3px; height: 13px; background: var(--accent); flex: none; }
.face { flex: none; border: 1px solid var(--line2); border-radius: 2px; object-fit: cover; display: grid; place-items: center; color: #0b0f14; font-weight: 600; overflow: hidden; }
.help { color: var(--mute); font-size: 12px; margin: 0; line-height: 1.6; }
ul.help { padding-left: 16px; } .help li { margin-bottom: 3px; }
.chip { font-size: 11px; padding: 1px 7px; border-radius: 2px; background: var(--well); border: 1px solid var(--line); color: var(--mute); white-space: nowrap; }
.chip.w { color: var(--gold); border-color: rgba(242,181,75,.45); background: rgba(242,181,75,.08); }
.chip.d { color: var(--red); border-color: rgba(255,90,82,.45); background: rgba(255,90,82,.08); }
.chip.g { color: var(--green); border-color: rgba(95,211,138,.4); background: rgba(95,211,138,.07); }
.g1 { color: var(--green); } .g2 { color: var(--blue); } .g3 { color: var(--purple); }

/* ---------- 메뉴 ---------- */
#menu { min-height: 100%; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1000px; margin: 0 auto; display: grid; gap: 18px; }
.head h1 { font-size: clamp(30px, 6vw, 44px); line-height: 1.1; letter-spacing: -.01em; }
.head h1::after { content: "LAST ISLE"; display: block; font-family: var(--disp); font-size: 13px; letter-spacing: .4em; color: var(--accent); margin-top: 6px; font-weight: 600; }
.head p { margin: 8px 0 0; color: var(--mute); max-width: 60ch; }
.cols { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 780px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 12px; min-width: 0; align-content: start; }
.field { display: grid; gap: 5px; min-width: 0; }
.sw { width: 24px; height: 24px; padding: 0; border-radius: 50%; border: 2px solid var(--bg); box-shadow: 0 0 0 1px var(--line2); }
.sw[aria-pressed=true] { box-shadow: 0 0 0 2px var(--accent); }
.wp { flex: 1 1 120px; text-align: left; display: grid; gap: 2px; padding: 9px 10px; background: var(--well); }
.wp[aria-pressed=true] { border-color: var(--accent); background: rgba(63,208,217,.08); }
.wp small { color: var(--mute); font-size: 12px; }
.stat { display: grid; grid-template-columns: 44px 26px 1fr 26px; gap: 8px; align-items: center; }
.stat button { padding: 0; height: 24px; }
.stat small { grid-column: 3; color: var(--dim); font-size: 11px; margin-top: -5px; }
.pips { display: flex; gap: 3px; } .pips i { flex: 1; height: 6px; background: var(--well); border-radius: 1px; }
.pips i.on { background: var(--accent); }

/* ---------- 게임 ---------- */
#game { min-height: 100%; padding-block: 14px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.grid { display: grid; grid-template-columns: 280px minmax(0, 1fr) 290px; gap: 12px; align-items: start; max-width: 1500px; margin: 0 auto; }
@media (max-width: 1100px) { .grid { grid-template-columns: 260px minmax(0, 1fr); } #colR { grid-column: 1 / -1; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); } }
@media (max-width: 720px) { .grid { grid-template-columns: minmax(0, 1fr); } #colC { order: 1; } #colR { order: 2; } #colL { order: 3; } }
#title { gap: 6px; } #title h1 { font-size: 17px; } #title h1::after { content: " LAST ISLE"; font-family: var(--disp); font-size: 11px; letter-spacing: .3em; color: var(--accent); }
.who { display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
.who .nm { font-size: 16px; font-weight: 600; line-height: 1.25; }
.who small { color: var(--mute); display: block; font-size: 12px; }
.meters { display: grid; gap: 6px; }
.meter { display: grid; grid-template-columns: 30px 1fr 54px; gap: 8px; align-items: center; font-size: 12px; color: var(--mute); }
.meter .bar { height: 7px; background: var(--well); border-radius: 1px; position: relative; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.meter .bar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #1fa4ad, var(--accent)); transition: width .3s; }
.meter.hp .bar i { background: linear-gradient(90deg, #c8372f, var(--red)); }
.meter.hun .bar i { background: linear-gradient(90deg, #c98a25, var(--gold)); }
.meter.xp .bar i { background: linear-gradient(90deg, #3a7fd0, var(--blue)); }
.meter b { color: var(--fg); text-align: right; font-family: var(--disp); font-weight: 600; font-size: 14px; }
.kvs { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 13px; } .kvs dt { color: var(--mute); } .kvs dd { margin: 0; min-width: 0; } .kvs small { color: var(--mute); font-size: 12px; }
.slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.slot { aspect-ratio: 1; padding: 0; background: var(--well); border-color: var(--line); position: relative; font-size: 21px; line-height: 1; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.slot.g1 { border-color: rgba(95,211,138,.55); background: linear-gradient(160deg, rgba(95,211,138,.14), var(--well) 70%); }
.slot.g2 { border-color: rgba(90,169,255,.6); background: linear-gradient(160deg, rgba(90,169,255,.16), var(--well) 70%); }
.slot.g3 { border-color: rgba(185,139,255,.65); background: linear-gradient(160deg, rgba(185,139,255,.18), var(--well) 70%); }
.slot[aria-pressed=true] { box-shadow: 0 0 0 2px var(--accent); }
.slot small { position: absolute; right: 3px; bottom: 1px; font-family: var(--disp); font-weight: 700; font-size: 13px; color: var(--fg); text-shadow: 0 1px 2px #000; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 3px; }
.tabs button { flex: 1 1 auto; border: 0; background: none; color: var(--mute); padding: 7px 12px; border-radius: 2px; }
.tabs button:hover:not(:disabled) { background: var(--panel-hi); color: var(--fg); }
.tabs button[aria-selected=true] { color: #04191b; background: var(--accent); font-weight: 600; }
#mapView { position: relative; overflow: hidden; background: radial-gradient(circle at 50% 45%, #1b2430, #0d1218 75%); border: 1px solid var(--line); border-radius: 3px; aspect-ratio: 600 / 524; max-height: 600px; width: 100%; cursor: grab; }
#mapView.drag { cursor: grabbing; }
#mapInner { position: absolute; left: 0; top: 0; width: 600px; height: 524px; transform-origin: 0 0; }
#mapInner canvas, #mapInner svg { position: absolute; inset: 0; width: 600px; height: 524px; display: block; }
#mapSvg .zl rect { fill: rgba(14,19,26,.86); stroke: rgba(255,255,255,.14); stroke-width: 1; }
#mapSvg .zl text { font-family: var(--sans); font-size: 12px; font-weight: 500; fill: #e9edf2; pointer-events: none; }
#mapSvg .zl.z1 rect { stroke: var(--gold); } #mapSvg .zl.z1 text { fill: var(--gold); }
#mapSvg .zl.z2 rect { fill: rgba(40,10,12,.85); stroke: rgba(255,90,82,.5); } #mapSvg .zl.z2 text { fill: #b47670; text-decoration: line-through; }
#mapSvg .zl.cur rect { fill: var(--accent); stroke: var(--accent); } #mapSvg .zl.cur[role=button] { cursor: pointer; } #mapSvg .zl.cur[role=button]:hover rect { fill: #6ee0e7; } #mapSvg .zl.cur text { fill: #04191b; font-weight: 600; }
#mapSvg .zl.adj { cursor: pointer; } #mapSvg .zl.adj rect { stroke: var(--accent); stroke-width: 1.5; }
#mapSvg .zl.adj:hover rect, #mapSvg .zl.adj:focus-visible rect { fill: rgba(63,208,217,.3); }
#mapSvg .zl:focus { outline: none; }
#mapSvg .pm { fill: rgba(230,235,241,.55); }
#mapSvg .pm.here { stroke: #0b0f14; stroke-width: 2; cursor: pointer; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
#mapSvg .pm.here:hover, #mapSvg .pm.here:focus-visible { stroke: #fff; outline: none; }
#mapSvg .pm.done { fill-opacity: .5; }
#mapSvg .tag rect, #mapSvg .tag path { fill: var(--gold); } #mapSvg .tag text { fill: #1d1303; font-family: var(--sans); font-size: 11px; font-weight: 600; }
#mapSvg .tag.base rect, #mapSvg .tag.base path { fill: var(--green); } #mapSvg .tag.base text { fill: #06200f; }
#mapSvg .route { stroke: var(--gold); stroke-width: 2.5; stroke-dasharray: 5 5; animation: march .8s linear infinite; }
@keyframes march { to { stroke-dashoffset: -20; } }
@media (prefers-reduced-motion: reduce) { #mapSvg .route { animation: none; } .meter .bar i { transition: none; } }
#zoom { position: absolute; right: 8px; top: 8px; display: grid; gap: 4px; z-index: 2; } #zoom button { width: 30px; height: 30px; padding: 0; background: rgba(14,19,26,.9); }
#mapHint { position: absolute; left: 10px; bottom: 8px; z-index: 2; pointer-events: none; color: #a9b4c3; text-shadow: 0 1px 2px #000; }
#legend { display: flex; flex-wrap: wrap; gap: 5px; } #legend span { display: inline-flex; align-items: center; gap: 6px; } #legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
.card { display: grid; grid-template-columns: 14px 1fr; gap: 1px 10px; text-align: left; background: var(--well); border-color: var(--line); padding: 9px 11px; align-items: center; }
.card i { width: 10px; height: 10px; border-radius: 50%; grid-row: span 2; box-shadow: 0 0 0 3px rgba(255,255,255,.04); }
.card b { font-weight: 500; min-width: 0; } .card small { font-size: 12px; color: var(--mute); }
.card small u { text-decoration: none; } .card .dots { letter-spacing: 1px; color: var(--gold); }
.prog { height: 6px; background: var(--well); border-radius: 1px; position: relative; overflow: hidden; } .prog i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #1fa4ad, var(--accent)); }
.rc { display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; text-align: left; width: 100%; padding: 7px 11px; background: var(--well); border-color: var(--line); }
.rc.ok { border-color: rgba(95,211,138,.5); } .rc small { grid-column: 1 / -1; color: var(--mute); font-size: 12px; } .rc small .no, .no { color: var(--red); } .rc u { text-decoration: none; color: var(--green); font-size: 12px; font-weight: 600; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; }
.vs .side { display: grid; gap: 6px; min-width: 0; } .vs .side:last-child .who { flex-direction: row-reverse; text-align: right; }
.vs .mid { font-family: var(--disp); font-weight: 700; font-size: 34px; color: var(--gold); text-align: center; line-height: 1; } .vs .mid small { display: block; font-size: 14px; color: var(--mute); margin-top: 4px; }
.hpb { height: 9px; background: var(--well); border-radius: 1px; position: relative; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); } .hpb i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #c8372f, var(--red)); transition: width .3s; }
.log { display: grid; gap: 4px; max-height: 280px; overflow-y: auto; align-content: start; font-size: 13px; }
.log div { display: grid; grid-template-columns: 42px 1fr; gap: 8px; } .log time { font-family: var(--disp); font-weight: 600; font-size: 13px; color: var(--dim); }
.log .bad span { color: var(--red); } .log .good span { color: var(--green); } .log .sys span { color: var(--mute); } .log .talk span { color: var(--gold); font-style: italic; } .log .warn span { color: var(--gold); }
#blog { max-height: 170px; background: var(--well); padding: 8px 10px; border-radius: 2px; } #blog div, #chatLog div { grid-template-columns: 1fr; } #chatLog b { color: var(--accent); font-weight: 500; }
#chatLog, #feedLog { max-height: 220px; }
.person { display: flex; gap: 10px; align-items: center; min-width: 0; padding: 4px 0; } .person .nm { flex: 1; min-width: 0; line-height: 1.3; } .person small { color: var(--mute); display: block; font-size: 12px; } .person.out { opacity: .4; }
.person > b { font-family: var(--disp); font-weight: 700; color: var(--mute); width: 22px; font-size: 16px; }
#clock .big { font-family: var(--disp); font-size: 52px; font-weight: 600; line-height: .95; letter-spacing: .02em; }
#clock .warn { color: var(--gold); font-weight: 500; }
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--panel-hi); border: 1px solid var(--accent); border-radius: 3px; padding: 9px 18px; z-index: 20; max-width: calc(100vw - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.5); }
/* 제작 */
.craft { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 12px; }
@media (max-width: 860px) { .craft { grid-template-columns: minmax(0, 1fr); } }
.cleft, .cright { display: grid; gap: 8px; align-content: start; min-width: 0; }
.cfilt { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 4px; }
.cfilt button { white-space: nowrap; }
.cfilt button { display: flex; justify-content: space-between; gap: 6px; padding: 5px 9px; background: var(--well); border-color: var(--line); font-size: 13px; }
.cfilt button .num { color: var(--dim); font-size: 13px; }
.cfilt button[aria-pressed=true] { background: rgba(63,208,217,.14); border-color: var(--accent); color: var(--accent); }
.igrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 5px; max-height: 360px; overflow-y: auto; padding: 2px; }
.itile { aspect-ratio: 1; padding: 0; display: grid; place-items: center; position: relative; font-size: 24px; line-height: 1; border: 1px solid var(--line); border-radius: 2px; background: linear-gradient(160deg, rgba(160,170,185,.12), var(--well) 75%); font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.itile.g1 { border-color: rgba(95,211,138,.55); background: linear-gradient(160deg, rgba(95,211,138,.2), var(--well) 75%); }
.itile.g2 { border-color: rgba(90,169,255,.6); background: linear-gradient(160deg, rgba(90,169,255,.22), var(--well) 75%); }
.itile.g3 { border-color: rgba(185,139,255,.65); background: linear-gradient(160deg, rgba(185,139,255,.26), var(--well) 75%); }
.itile[aria-pressed=true] { box-shadow: 0 0 0 2px var(--fg); }
.itile.sm { width: 30px; font-size: 16px; flex: none; }
.itile .can { position: absolute; right: 3px; top: 3px; width: 8px; height: 8px; background: var(--green); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
.itile small { position: absolute; right: 3px; bottom: 1px; font-family: var(--disp); font-weight: 700; font-size: 12px; color: var(--fg); text-shadow: 0 1px 2px #000; }
.itile em { position: absolute; left: 0; right: 0; bottom: 0; font-style: normal; font-family: var(--sans); font-size: 10px; background: var(--gold); color: #1d1303; }
.csec { display: grid; gap: 6px; background: var(--well); border: 1px solid var(--line); border-radius: 2px; padding: 8px 10px; min-width: 0; }
.uppers { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.treewrap { overflow-x: auto; padding: 4px 0 2px; }
.tree, .tree ul { list-style: none; margin: 0; padding: 0; display: flex; justify-content: center; }
.tree ul { padding-top: 14px; position: relative; }
.tree li { position: relative; padding: 14px 4px 0; display: flex; flex-direction: column; align-items: center; }
.tree > li { padding-top: 0; }
.tree li::before, .tree li::after { content: ""; position: absolute; top: 0; height: 14px; border-top: 1px solid var(--line2); width: 50%; }
.tree li::before { right: 50%; } .tree li::after { left: 50%; border-left: 1px solid var(--line2); }
.tree li:first-child::before, .tree li:last-child::after { border-top: 0; }
.tree li:only-child::before { display: none; } .tree li:only-child::after { border-top: 0; }
.tree > li::before, .tree > li::after { display: none; }
.tree ul::before { content: ""; position: absolute; top: 0; left: 50%; height: 14px; border-left: 1px solid var(--line2); }
.tnode { display: grid; justify-items: center; gap: 2px; padding: 5px 6px; background: var(--panel); border-color: var(--line); min-width: 64px; }
.tnode .tn { font-size: 11px; color: var(--fg); white-space: nowrap; }
.tnode .num { font-size: 12px; padding: 0 5px; border: 1px solid var(--line); } .tnode .num.ok { color: var(--green); } .tnode .num.no { color: var(--red); }
.cdet { display: grid; gap: 8px; background: var(--well); border: 1px solid var(--line2); border-radius: 2px; padding: 10px 12px; }
.cdet .nm { font-size: 17px; font-weight: 600; }
.cdet .stats { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--green); }
.cdet button[aria-pressed=true] { border-color: var(--gold); color: var(--gold); }
#mapSvg .gmat rect { fill: rgba(14,19,26,.9); stroke: var(--gold); stroke-width: 1; }
#mapSvg .gmat text { font-size: 12px; }
.cards.acts { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
.card.main { border-color: var(--accent); background: linear-gradient(160deg, rgba(63,208,217,.16), var(--well) 70%); }
.card.main b { color: var(--accent); font-size: 16px; }
/* ===== SF 연구시설 HUD 스킨 ===== */
:root {
  --bg: #05080c; --panel: rgba(9,17,24,.9); --panel-hi: rgba(13,26,35,.92); --well: rgba(3,8,12,.75);
  --line: #18303d; --line2: #2b5868; --fg: #d6e5ec; --mute: #6f8a97; --dim: #47606c;
  --accent: #3fd6e8; --gold: #e8b54a;
  --cut: 10px;
}
body { background-color: var(--bg);
  background-image: radial-gradient(1400px 700px at 50% 0, rgba(22,60,78,.45), transparent 70%), radial-gradient(900px 500px at 50% 110%, rgba(10,40,52,.35), transparent 70%),
    linear-gradient(rgba(63,214,232,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(63,214,232,.035) 1px, transparent 1px);
  background-size: auto, auto, 32px 32px, 32px 32px; background-attachment: fixed; }

        ${me.inBase && !inB ? `<button class="sm" ${cmdAttr({ k: 'stash', slot: sel })}>창고에 보관</button>` : ''}${!inB && me.alive ? `<button class="sm" ${cmdAttr({ k: 'drop', slot: sel })}>버림</button>` : ''}</div>`;

  function renderStatus(v, me, alive) {

        ${v.spec ? `<div class="meters">${meter('hp', '체력', v.spec.hp, v.spec.mh)}</div><span class="lab">${ZONES[v.spec.zone].n} · Lv ${v.spec.lvl}</span>` : ''}`;
    }
    else if (v.here && v.here.enc && !me.act) {
      const o = v.here.enc, p = P[o.id] || NOBODY;
      h = `<h3><span>조우 · ${ZONES[me.zone].n}</span><span class="chip w">상대는 아직 모른다</span></h3>
        <div class="who">${face(p, 64)}<div class="grow"><div class="nm">${esc(p.name)}${o.grudge ? ' <span class="chip d">나를 친 상대</span>' : ''}</div><small>Lv ${o.lvl} · ${ITEMS[o.w] ? ITEMS[o.w].n : '맨손'} · ${o.cond}</small><small>${esc(p.bio || '')}</small></div></div>
        <div class="cards acts"><button class="card act main danger-card" style="grid-template-columns:1fr" ${cmdAttr({ k: 'attack', who: o.id })} ${me.en < G.COST.attack ? 'disabled' : ''}><b>선제공격</b><small>스태미너 ${G.COST.attack} · 상대는 이번엔 되받아치지 못한다</small></button>
        <button class="card act" style="grid-template-columns:1fr" ${cmdAttr({ k: 'ignore' })}><b>지나친다</b><small>들키지 않고 넘어간다</small></button></div>`;
    }

      const RES = { win: ['쓰러뜨림', 'g'], hit: ['공격 성공', 'g'], ambushed: ['기습당함', 'd'], lose: ['패배', 'd'], fled: ['도주 성공', 'w'], escaped: ['상대가 도주', 'w'], draw: ['승부 없음', ''] }[f.res];

  function renderPlaces(v, me) {

    } else if (!v.started || !me.alive || v.over) h = '<p class="help">지금은 할 수 없다.</p>';
    else if (tab === 'craft') {
      const all = Object.values(ITEMS), q = craftQ.trim();
      const shown = all.filter(it => (craftCat === 'all' || CFILT[craftCat].test(it)) && (!q || it.n.includes(q)));
      if (!ITEMS[craftSel]) craftSel = (shown.find(it => recipeOf(it.id)) || shown[0] || all[0]).id;
      const it = ITEMS[craftSel], rec = recipeOf(it.id), ok = rec && Object.keys(rec.in).every(k => count(me, k) >= rec.in[k]);
      const uppers = RECIPES.filter(r => r.in[it.id]).map(r => ITEMS[r.out]);
      const cnt = k => all.filter(x => k === 'all' || CFILT[k].test(x)).length;
      h = `<h3><span>아이템 제작</span><span class="lab">${goal ? `목표 · <span class="g${grade(ITEMS[goal])}">${ITEMS[goal].n}</span>` : '목표를 정하면 지도에 재료 위치가 표시된다'}</span></h3>
      <div class="craft">
        <div class="cleft">
          <input type="text" id="craftQ" placeholder="아이템 검색" value="${esc(craftQ)}" aria-label="아이템 검색">
          <div class="cfilt">${CFILT_ORDER.map(([k, n]) => `<button data-cf="${k}" aria-pressed="${craftCat === k}">${n}<span class="num">${cnt(k)}</span></button>`).join('')}</div>
          <div class="igrid">${shown.map(x => { const r = recipeOf(x.id), can = r && Object.keys(r.in).every(k => count(me, k) >= r.in[k]), have = count(me, x.id); return `<button class="itile g${grade(x)}" data-ci="${x.id}" aria-pressed="${x.id === craftSel}" aria-label="${x.n}" title="${x.n}">${x.e}${can ? '<i class="can" aria-hidden="true"></i>' : ''}${have ? `<small>${have}</small>` : ''}${x.id === goal ? '<em>목표</em>' : ''}</button>`; }).join('') || '<p class="help">찾는 아이템이 없다.</p>'}</div>
        </div>
        <div class="cright">
          <div class="csec"><span class="lab">상위 아이템</span><div class="uppers">${uppers.length ? uppers.map(u => `<button class="itile sm g${grade(u)}" data-ci="${u.id}" title="${u.n}">${u.e}</button><span class="lab">${u.n}</span>`).join('') : '<span class="help">이 아이템으로 만들 수 있는 것이 없다.</span>'}</div></div>
          <div class="csec"><span class="lab">제작 트리</span><div class="treewrap"><ul class="tree">${treeNode(it.id, 1, me)}</ul></div></div>
          <div class="cdet">
            <div class="row" style="align-items:flex-start"><span class="itile g${grade(it)}" style="width:54px;font-size:28px" aria-hidden="true">${it.e}</span>
              <div class="grow"><div class="nm g${grade(it)}">${it.n}</div><span class="lab">${TYPE_N[it.t]}${it.wc ? ' · ' + WEAPONS[it.wc].n : ''} · ${GRADE_N[grade(it)]}</span></div>
              <div class="row">${rec ? `<button class="go" ${cmdAttr({ k: 'craft', r: it.id })} ${ok && !v.battle ? '' : 'disabled'}>제작</button>` : ''}<button data-goal="${it.id}" ${goal === it.id ? 'aria-pressed="true"' : ''}>${goal === it.id ? '목표 해제' : '목표로 설정'}</button></div></div>
            <div class="stats">${statLine(it)}</div>
            ${it.t === 'weapon' && it.wc !== ITEMS[me.eq.weapon].wc ? '<p class="help no">지금 쥔 무기와 계열이 다르다. 이 계열의 1단계 무기부터 있어야 만들 수 있다.</p>' : ''}
            ${rec ? `<span class="lab">필요한 재료</span><p class="help rc" style="padding:0;background:none;border:0"><small style="font-size:13px">${need(me, rec.in)}</small></p>` : ''}
            ${!rec ? `<span class="lab">얻는 곳</span><p class="help">${sources(it.id).map(z => ZONES[z].n).join(', ') || (it.tier === 1 ? '시작할 때 지급된다.' : '보급 상자에서만 나온다.')}${HUNT[it.id] ? ' · 사냥' : ''}${CRATE_SET.has(it.id) ? ' · 보급 상자' : ''}</p>` : ''}
            <span class="lab">보유 ${count(me, it.id)}개</span>
          </div>
        </div>
      </div>`;
    } else {
      const here = me.base && me.base.zone === me.zone, st = v.zs[me.zone], busy = !!(v.battle || me.act);
      h = `<h3><span>거점</span><span class="lab">${me.base ? ZONES[me.base.zone].n + (me.inBase ? ' · 안에 있음' : '') : '없음'}</span></h3>
        <ul class="help"><li>거점 안에 있으면 누구에게도 발견되지 않고 습격당하지 않는다. 허기는 절반 속도로 줄고, 쉬면 체력까지 회복된다.</li><li>한동안 조작이 없으면 같은 구역의 거점으로 알아서 돌아간다.</li><li>구역이 폐쇄되면 거점은 무너지고 창고의 물건도 사라진다. 최종 구역에서는 거점을 쓸 수 없다.</li></ul>`;
      if (v.final) h += '<p class="no" style="margin:0">이제 숨을 곳은 없다.</p>';
      else {
        h += '<div class="cards">';
        if (me.inBase) h += `<button class="card" style="grid-template-columns:1fr" ${cmdAttr({ k: 'leave' })}><b>나간다</b><small>다시 들킬 수 있다</small></button>`;
        else if (here) h += `<button class="card" style="grid-template-columns:1fr" ${cmdAttr({ k: 'enter' })} ${busy ? 'disabled' : ''}><b>들어간다</b><small>안전</small></button>`;
        else h += `<button class="card" style="grid-template-columns:1fr" ${cmdAttr({ k: 'build' })} ${st !== 0 || busy ? 'disabled' : ''}><b>${me.base ? `${G.J(ZONES[me.zone].n, '으로', '로')} 거점을 옮긴다` : `${ZONES[me.zone].n}에 거점을 짓는다`}</b><small>${G.DUR.build}초 · 스태미너 ${G.COST.build}${me.base ? ' · 옛 창고는 버려짐' : ''}${st !== 0 ? ' · 폐쇄 예고 구역 불가' : ''}</small></button>`;
        h += '</div>';
        if (!here) h += `<span class="lab">필요한 재료: ${need(me, BASE_COST)}</span>`;
        if (me.inBase) h += `<span class="lab">── 창고 ${me.base.stash.length}/${G.STASH} · 소지품 칸을 눌러 ‘창고에 보관’ ──</span>${me.base.stash.map((s, i) => `<div class="person"><span class="nm">${ITEMS[s.id].e} ${ITEMS[s.id].n} ×${s.n}</span><button class="sm" ${cmdAttr({ k: 'unstash', i })}>꺼낸다</button></div>`).join('') || '<p class="help">비어 있다.</p>'}`;
      }
    }
    set('pane', h);
  }
  window.__ic = { get world() { return world; }, get view() { return view; }, get myId() { return myId; } };
})();
</script>
